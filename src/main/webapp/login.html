<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Sign In | REC CampusFind</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="stylesheet" href="css/variables.css?v=4.0">
  <link rel="stylesheet" href="css/base.css?v=4.0">
  <link rel="stylesheet" href="css/layout.css?v=4.0">
  <link rel="stylesheet" href="css/components.css?v=4.0">
  <link rel="stylesheet" href="css/pages.css?v=4.0">
</head>
<body style="background: var(--bg-secondary); min-height: 100vh; display: flex; flex-direction: column;">

  <!-- Simple Navigation Header -->
  <header class="navbar" style="background: #FFFFFF;">
    <div class="container navbar-inner">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            <circle cx="11" cy="11" r="3"></circle>
          </svg>
        </div>
        <span>REC CampusFind</span>
      </a>

      <nav class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="browse.html" class="nav-link">Lost & Found Feed</a>
      </nav>

      <div class="nav-actions">
        <a href="browse.html" class="btn btn-outline btn-sm">Browse Feed</a>
      </div>
    </div>
  </header>

  <!-- Login Main Content: Clean, Single-Field, Passwordless -->
  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px 16px;">
    <div class="card" style="max-width: 440px; width: 100%; padding: 40px 32px; box-shadow: var(--shadow-card); border-radius: var(--border-radius-xl); background: #FFFFFF; text-align: center;">
      
      <!-- College Logo Icon -->
      <div style="margin: 0 auto 18px auto; width: 56px; height: 56px; border-radius: 16px; background: var(--accent-light); color: var(--accent-primary); display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-sm);">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
      </div>

      <h1 style="font-size: 22px; font-weight: 800; color: var(--text-primary); margin-bottom: 6px; letter-spacing: -0.01em;">
        Sign In
      </h1>
      <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 28px;">
        Rajalakshmi Engineering College
      </p>

      <!-- Redirect notice if coming from Report Item -->
      <div id="redirect-notice" style="display: none; background: #EFF6FF; border: 1px solid #BFDBFE; border-radius: var(--border-radius-md); padding: 10px 14px; font-size: 13px; color: #1D4ED8; margin-bottom: 20px; font-weight: 600;">
        Enter your student email to post your item.
      </div>

      <!-- Single-Field Form -->
      <form id="email-login-form" novalidate style="text-align: left;">
        <div class="form-group" style="margin-bottom: 20px;">
          <label for="student-email" class="form-label" style="font-weight: 700; font-size: 13px; color: var(--text-primary); margin-bottom: 8px; display: block;">
            Student Email
          </label>
          <input 
            type="email" 
            id="student-email" 
            class="form-input" 
            placeholder="student@rajalakshmi.edu.in" 
            required 
            autocomplete="email"
            autofocus
            style="width: 100%; height: 46px; font-size: 14px; border-radius: var(--border-radius-md); padding: 0 14px;"
          >
          <div id="email-error-msg" style="display: none; color: #E11D48; font-size: 12px; font-weight: 600; margin-top: 6px;"></div>
        </div>

        <button 
          type="submit" 
          id="login-submit-btn" 
          class="btn btn-primary" 
          style="width: 100%; height: 46px; font-size: 15px; font-weight: 700; border-radius: var(--border-radius-md); justify-content: center; box-shadow: var(--shadow-md);"
        >
          <span>Continue</span>
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-left: 6px;">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>

      <div style="margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--border-color); font-size: 12px; color: var(--text-muted); text-align: center;">
        Direct access for Rajalakshmi Engineering College students
      </div>

    </div>
  </main>

  <footer style="text-align: center; padding: 20px 16px; font-size: 12px; color: var(--text-muted);">
    &copy; 2026 Rajalakshmi Engineering College • Campus Lost & Found System
  </footer>

  <script src="js/api.js?v=4.0"></script>
  <script src="js/main.js?v=4.0"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Clear any legacy auth cache immediately
      try {
        localStorage.removeItem('campus_lf_user');
        localStorage.removeItem('campus_lf_role');
      } catch (e) {}

      const urlParams = new URLSearchParams(window.location.search);
      const redirectUrl = urlParams.get('redirect');

      if (redirectUrl) {
        const notice = document.getElementById('redirect-notice');
        if (notice) notice.style.display = 'block';
      }

      const form = document.getElementById('email-login-form');
      const emailInput = document.getElementById('student-email');
      const errorMsg = document.getElementById('email-error-msg');
      const submitBtn = document.getElementById('login-submit-btn');

      function showError(msg) {
        errorMsg.textContent = msg;
        errorMsg.style.display = 'block';
        emailInput.style.borderColor = '#E11D48';
      }

      function clearError() {
        errorMsg.textContent = '';
        errorMsg.style.display = 'none';
        emailInput.style.borderColor = '';
      }

      emailInput.addEventListener('input', clearError);

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearError();

        const email = emailInput.value.trim().toLowerCase();

        if (!email) {
          showError('Please enter your student email.');
          emailInput.focus();
          return;
        }

        if (!email.endsWith('@rajalakshmi.edu.in')) {
          showError('Please enter a valid college email ending with @rajalakshmi.edu.in');
          emailInput.focus();
          return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span>Signing in...</span>';

        try {
          const user = await API.login(email);
          if (user) {
            UI.showToast('Welcome!', 'Signed in successfully as ' + (user.fullName || user.email), 'success');
            setTimeout(() => {
              window.location.href = redirectUrl ? decodeURIComponent(redirectUrl) : 'index.html';
            }, 500);
          } else {
            showError('Unable to sign in. Please verify your email.');
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>Continue &rarr;</span>';
          }
        } catch (err) {
          showError(err.message || 'Error signing in. Please try again.');
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>Continue &rarr;</span>';
        }
      });
    });
  </script>
</body>
</html>
